<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
  <title id="title">Luồng gọi tổng quát của LinIf_MainFunction</title>
  <desc id="desc">Sơ đồ tổng quát mô tả Application cập nhật COM shadow buffer, LinIf_MainFunction chọn giữa nhánh confirmation và nhánh truyền frame mới, sau đó gọi PduR, COM và LIN driver.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5 L1,9 Z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .sub { font: 16px Arial, Helvetica, sans-serif; fill: #475569; }
      .box-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .text { font: 15px Arial, Helvetica, sans-serif; fill: #334155; }
      .mono { font: 14px Menlo, Consolas, monospace; fill: #0f172a; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .label { font: 700 14px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 6; rx: 14; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 10; }
      .app { fill: #eef2ff; stroke: #4f46e5; }
      .com { fill: #ecfdf5; stroke: #059669; }
      .linif { fill: #eff6ff; stroke: #0b65c2; }
      .pdur { fill: #fff7ed; stroke: #ea580c; }
      .lin { fill: #fdf2f8; stroke: #db2777; }
      .hw { fill: #f1f5f9; stroke: #475569; }
      .ok { fill: #ecfdf5; stroke: #059669; }
      .warn { fill: #fff7ed; stroke: #f59e0b; }
      .decision { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .arrow { stroke: #1f2937; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #0b65c2; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
      .arrow-dash { stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="820" fill="#ffffff"/>

  <text class="title" x="40" y="44">Luồng gọi tổng quát của LinIf_MainFunction()</text>
  <text class="sub" x="40" y="72">LIN demo dùng pull data: COM giữ payload mới nhất, LinIf quyết định thời điểm kéo và phát theo schedule.</text>

  <!-- Top preparation flow -->
  <rect class="box app" x="40" y="105" width="250" height="78"/>
  <text class="box-title" x="58" y="132">Application / demo</text>
  <text class="mono" x="58" y="157">Com_SendSignal(...)</text>
  <text class="small" x="58" y="176">cập nhật signal mới</text>

  <rect class="box com" x="365" y="105" width="265" height="78"/>
  <text class="box-title" x="383" y="132">COM shadow buffer</text>
  <text class="small" x="383" y="157">LightCtrl / HVACCtrl payload</text>
  <text class="small" x="383" y="176">chờ LinIf pull khi tới slot</text>

  <rect class="box linif" x="735" y="105" width="325" height="78"/>
  <text class="box-title" x="753" y="132">Main loop / OS task</text>
  <text class="mono" x="753" y="157">LinIf_MainFunction()</text>
  <text class="small" x="753" y="176">được gọi định kỳ</text>

  <path class="arrow" d="M290 144 L365 144"/>
  <text class="label" x="303" y="132">pack</text>
  <path class="arrow-dash" d="M630 144 L735 144"/>
  <text class="label" x="646" y="132">pull later</text>

  <!-- Decision -->
  <path class="arrow-blue" d="M895 183 L895 220 L555 220 L555 250"/>
  <polygon class="decision" points="555,250 665,315 555,380 445,315"/>
  <text class="box-title" x="505" y="305">Có pending</text>
  <text class="box-title" x="498" y="327">confirmation?</text>
  <text class="mono" x="492" y="350">s_txPendingConf != 255</text>

  <!-- Branch frames -->
  <rect class="frame" x="35" y="415" width="500" height="335"/>
  <text class="label" x="55" y="445">Nhánh A - xử lý frame đã gửi ở lần gọi trước</text>

  <rect class="frame" x="565" y="415" width="500" height="335"/>
  <text class="label" x="585" y="445">Nhánh B - không pending, chạy schedule và gửi frame mới</text>

  <!-- Branch arrows -->
  <path class="arrow-blue" d="M445 315 L285 315 L285 415"/>
  <text class="label" x="340" y="302">YES</text>
  <path class="arrow-blue" d="M665 315 L815 315 L815 415"/>
  <text class="label" x="735" y="302">NO</text>

  <!-- Confirmation branch -->
  <rect class="box lin" x="70" y="470" width="220" height="52"/>
  <text class="box-title" x="88" y="493">LIN driver</text>
  <text class="mono" x="88" y="513">Lin_GetStatus()</text>

  <rect class="box ok" x="70" y="555" width="220" height="66"/>
  <text class="box-title" x="88" y="580">Nếu LIN_TX_OK</text>
  <text class="mono" x="88" y="604">PduR_LinIfTxConfirmation</text>

  <rect class="box com" x="70" y="655" width="220" height="52"/>
  <text class="box-title" x="88" y="678">PduR -> COM</text>
  <text class="mono" x="88" y="698">Com_TxConfirmation()</text>

  <rect class="box warn" x="315" y="555" width="185" height="152"/>
  <text class="box-title" x="333" y="580">Nếu chưa xong</text>
  <text class="small" x="333" y="605">LIN_BUSY:</text>
  <text class="small" x="333" y="625">giữ pending, return</text>
  <text class="small" x="333" y="655">LIN_TX_ERROR / LIN_OK:</text>
  <text class="small" x="333" y="675">reset pending</text>
  <text class="small" x="333" y="695">không confirm</text>

  <path class="arrow" d="M180 522 L180 555"/>
  <path class="arrow" d="M180 621 L180 655"/>
  <path class="arrow" d="M290 496 L365 496 L365 555"/>
  <text class="label" x="310" y="485">busy/error</text>

  <!-- Transmit branch -->
  <rect class="box linif" x="595" y="470" width="200" height="52"/>
  <text class="box-title" x="613" y="493">LinIf schedule</text>
  <text class="mono" x="613" y="513">tick++; chọn slot</text>

  <rect class="box pdur" x="595" y="555" width="200" height="66"/>
  <text class="box-title" x="613" y="580">Pull payload</text>
  <text class="mono" x="613" y="604">PduR_LinIfTriggerTransmit</text>

  <rect class="box com" x="595" y="655" width="200" height="52"/>
  <text class="box-title" x="613" y="678">COM</text>
  <text class="mono" x="613" y="698">Com_TriggerTransmit()</text>

  <rect class="box linif" x="830" y="470" width="205" height="52"/>
  <text class="box-title" x="848" y="493">Đóng gói LIN PDU</text>
  <text class="mono" x="848" y="513">Pid, Cs, Dl, SduPtr</text>

  <rect class="box lin" x="830" y="555" width="205" height="66"/>
  <text class="box-title" x="848" y="580">LIN driver</text>
  <text class="mono" x="848" y="604">Lin_SendFrame()</text>

  <rect class="box hw" x="830" y="655" width="205" height="52"/>
  <text class="box-title" x="848" y="678">USART2 / LIN bus</text>
  <text class="small" x="848" y="698">Break -> Sync -> PID -> Data -> CS</text>

  <path class="arrow" d="M695 522 L695 555"/>
  <path class="arrow" d="M695 621 L695 655"/>
  <path class="arrow" d="M795 681 L830 681"/>
  <path class="arrow" d="M932 522 L932 555"/>
  <path class="arrow" d="M932 621 L932 655"/>
  <path class="arrow" d="M795 496 L830 496"/>

  <!-- Bottom summary -->
  <rect class="box" x="40" y="775" width="1020" height="34"/>
  <text class="small" x="58" y="797">Mapping: slot 0 -> LinIf PDU 0 -> COM LightCtrl (3) -> LIN ID 0x10, DLC 4 | slot 1 -> LinIf PDU 1 -> COM HVACCtrl (4) -> LIN ID 0x11, DLC 3</text>
</svg>
